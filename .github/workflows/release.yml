name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run verify

      - name: Verify release assets
        run: |
          test -f manifest.json
          test -f main.js
          test -f styles.css

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Bragi Canvas ${{ github.ref_name }}.

            This release was built by GitHub Actions from the tagged source commit.
            Release assets:
            - manifest.json
            - main.js
            - styles.css
          fail_on_unmatched_files: true
          files: |
            manifest.json
            main.js
            styles.css
